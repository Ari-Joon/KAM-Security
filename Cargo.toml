[workspace]
resolver = "2"
# The shell is a workspace member so that it builds into the same target
# directory as the agent. The agent only serves clients installed alongside it,
# so co-located build output is what lets `cargo run` exercise that check
# instead of tripping over it.
members = ["crates/*", "ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["KAM Security contributors"]
license = "Apache-2.0"
repository = "https://github.com/OWNER/kam-security"

[workspace.dependencies]
# Versions alongside the paths so these are not wildcard dependencies. Nothing
# here is published to crates.io, but a wildcard is a real hazard in general and
# `cargo deny` is right to reject it rather than special-case us.
kam-core = { path = "crates/kam-core", version = "0.1.0" }
kam-ipc = { path = "crates/kam-ipc", version = "0.1.0" }
kam-scanner = { path = "crates/kam-scanner", version = "0.1.0" }
kam-firewall = { path = "crates/kam-firewall", version = "0.1.0" }
kam-storage = { path = "crates/kam-storage", version = "0.1.0" }
kam-quarantine = { path = "crates/kam-quarantine", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rusqlite = { version = "0.32", features = ["bundled"] }

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

blake3 = "1"

# Added at the phase that first needs them.
# windows-service = "0.7"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
