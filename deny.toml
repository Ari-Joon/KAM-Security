[graph]
# This is a Windows program and is only ever built for one target, so that is
# the dependency graph that gets audited. Without this the audit walks every
# platform's dependencies and fails on crates that are never compiled here:
# Tauri's Linux half pulls in the D-Bus crates (zbus_names, zvariant,
# zvariant_derive), which were declared unmaintained in October 2026, and
# through them a yanked async-executor. None of them is in a Windows build.
#
# Checkable:
#     cargo tree --target x86_64-pc-windows-msvc -i zvariant   -> nothing
targets = ["x86_64-pc-windows-msvc"]

[licenses]
# The project ships as a permissive open-source release, so no *strong*
# copyleft dependency may enter the tree. This is the rule that keeps libclamav
# (GPL-2.0) out -- see PLAN.md, "Licensing constraints".
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # MPL-2.0 is file-level copyleft and, unlike the GPL, explicitly permits
    # distributing a larger work under different terms. Linking it does not
    # make this project MPL. It arrives through Tauri's stylesheet parsing
    # (cssparser, cssparser-macros, dtoa-short) and via option-ext.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[[bans.deny]]
name = "openssl-sys"
reason = "use rustls or the Windows platform TLS stack instead"

[advisories]
yanked = "deny"

# Every entry here is justified. An unexplained ignore is how a real advisory
# gets waved through six months later.
#
# There used to be twelve. Eleven went in November 2026, because none of them
# matched anything any more:
#
#   - Five existed only because no fixed version could be reached. yara-x 1.22
#     moved to a patched wasmtime (48) and to rsa 0.10, which retired the four
#     wasmtime entries (RUSTSEC-2026-0222, -0269, -0316, -0327) and the rsa
#     timing one (RUSTSEC-2023-0071).
#   - Six were unmaintained crates reached through Tauri (RUSTSEC-2024-0370,
#     RUSTSEC-2025-0075, -0080, -0081, -0098, -0100). They are no longer in the
#     graph that is audited.
#
# `cargo deny` warns when an entry here matches nothing. That warning means
# delete the entry, not leave it for the day it starts matching something new.
ignore = [
    # This arrives through yara-x, which powers the rule matching in
    # `kam-rules`. That crate exists separately, and is linked only by the
    # unprivileged shell, because yara-x compiles rules to WebAssembly and runs
    # them through wasmtime's JIT, and a JIT does not belong inside a
    # LocalSystem service.
    #
    # Not a vulnerability. The bincode maintainers stopped work for reasons
    # that had nothing to do with the code, and consider the last release
    # complete.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained by maintainer choice, not defect; transitive through yara-x" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
