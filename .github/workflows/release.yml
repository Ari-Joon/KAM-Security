name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing here can write by default. The build runs third-party code (every
# build script, every proc-macro, vite and its plugins, the Tauri CLI), and a
# token able to write to this repository in reach of any of it could push to
# main, move a tag, or swap the release zip and SHA256SUMS together, so the
# checksum would vouch for whatever replaced it. That zip installs a
# LocalSystem service.
#
# So the build gets a read-only token it does not even keep, and the one job
# that can write builds nothing: it takes the artifact the build produced and
# attaches it to a draft release.
#
# Actions are pinned by commit, with the release they correspond to beside
# each, because a tag can be moved and a commit cannot. Dependabot keeps the
# pins current.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      # No build cache here, unlike CI. A cache restored into the release build
      # is something other than this commit's source ending up in the shipped
      # binaries; a release is rare enough to build from nothing.

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Install scripts are ignored so a compromised transitive dependency
      # cannot run code at install time. Nothing in the tree needs one; see the
      # matching step in ci.yml. npm checks every cached package against the
      # lockfile's integrity hash, which is why that cache is kept.
      - name: Build the frontend
        working-directory: ui
        run: npm ci --ignore-scripts && npm run build

      - name: Build the agent
        run: cargo build --release -p kam-agent

      - name: Build the shell
        working-directory: ui
        run: npm run tauri build -- --no-bundle

      - name: Stage the release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/kam-agent.exe dist/
          Copy-Item target/release/kam-shell.exe dist/
          Copy-Item README.md, LICENSE, SECURITY.md dist/
          # Setup lives beside the binaries so a download is unzip, run,
          # done. It registers the service and puts a shortcut on the
          # desktop, and `-Remove` undoes exactly those two things.
          Copy-Item scripts/setup.ps1 dist/
          # The two binaries must sit in one directory: the agent only serves
          # clients installed alongside it.
          Compress-Archive -Path dist/* -DestinationPath kam-security-windows-x64.zip

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash kam-security-windows-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  kam-security-windows-x64.zip" } |
            Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kam-security-windows-x64
          path: |
            kam-security-windows-x64.zip
            SHA256SUMS.txt

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: kam-security-windows-x64

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          files: |
            kam-security-windows-x64.zip
            SHA256SUMS.txt
          body: |
            ## Install

            Unzip anywhere, **keeping every file in one folder**: the agent
            only serves clients installed alongside it, so separating them stops
            the shell working. Then right-click `setup.ps1` and choose
            **Run with PowerShell**, or from a terminal:

            ```
            powershell -ExecutionPolicy Bypass -File setup.ps1
            ```

            It asks for administrator rights once, secures the folder, registers
            the service that makes the fast disk scan possible, and puts a
            shortcut on your desktop. The first time you open KAM Security it
            adds itself to your sign-in items, so its icon sits by the clock;
            untick **Start KAM Security when I sign in** on the Overview to stop
            that.

            To remove the service and the shortcut:

            ```
            powershell -ExecutionPolicy Bypass -File setup.ps1 -Remove
            ```

            The sign-in entry belongs to the app rather than the script, so
            untick the box above first if you are removing it for good.

            You can skip the script entirely and just run `kam-shell.exe`; the
            disk scan then falls back to walking directories, which works and is
            slower.

            ## These binaries are not signed

            SmartScreen will warn on first run, and some antivirus products may
            flag them. That is expected for an unsigned tool that enumerates
            every file on disk and runs an elevated service. Verify the checksum
            against `SHA256SUMS.txt`, and build from source if you would rather
            not trust a download.
