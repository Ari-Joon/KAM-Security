name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The shell embeds the built frontend at compile time, so `ui/dist` has to
      # exist before cargo touches the workspace.
      #
      # Install scripts are ignored by default so a compromised transitive
      # dependency cannot run code at install time. esbuild is the one exception
      # that genuinely needs its script: it fetches the platform-native binary
      # the bundler runs. `npm rebuild` re-runs that one package's install script
      # and nothing else, which keeps the default-deny posture while letting the
      # build work. (The previous `npm approve-scripts` is not an npm command and
      # failed every run.)
      - name: Build the frontend
        working-directory: ui
        run: npm ci --ignore-scripts && npm rebuild esbuild && npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  deny:
    name: licence and advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
