name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The shell embeds the built frontend at compile time, so `ui/dist` has to
      # exist before cargo touches the workspace.
      #
      # Install scripts are ignored so a compromised transitive dependency
      # cannot run code at install time. Nothing in the tree needs one: Vite 8
      # bundles with rolldown, whose native binaries arrive as prebuilt
      # platform packages rather than something fetched by a postinstall. Under
      # Vite 7 esbuild did need its script, which is why this line used to carry
      # a `npm rebuild esbuild` after the install.
      - name: Build the frontend
        working-directory: ui
        run: npm ci --ignore-scripts && npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  deny:
    name: licence and advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
