name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing in CI publishes anything.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Actions are pinned by commit, with the release they correspond to beside
# each, because a tag can be moved and a commit cannot. Dependabot keeps the
# pins current.
jobs:
  check:
    name: fmt, clippy, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The shell embeds the built frontend at compile time, so `ui/dist` has to
      # exist before cargo touches the workspace.
      #
      # Install scripts are ignored so a compromised transitive dependency
      # cannot run code at install time. Nothing in the tree needs one: Vite 8
      # bundles with rolldown, whose native binaries arrive as prebuilt
      # platform packages rather than something fetched by a postinstall. Under
      # Vite 7 esbuild did need its script, which is why this line used to carry
      # a `npm rebuild esbuild` after the install.
      - name: Build the frontend
        working-directory: ui
        run: npm ci --ignore-scripts && npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  deny:
    name: licence and advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
