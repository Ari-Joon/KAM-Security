[package]
name = "kam-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kam-agent"
path = "src/main.rs"

[dependencies]
kam-canary = { workspace = true }
kam-core = { workspace = true }
kam-ipc = { workspace = true }
kam-firewall = { workspace = true }
kam-quarantine = { workspace = true }
kam-scanner = { workspace = true }
kam-schedule = { workspace = true }
kam-storage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
windows = { workspace = true }
windows-service = "0.8.1"

# Build time only: embeds the icon and the description the service shows in
# Task Manager. It is the crate Tauri's own build step uses for the window, so
# it is already in the lockfile, and none of it is linked into the agent.
[build-dependencies]
tauri-winres = "0.3"

[lints]
workspace = true
