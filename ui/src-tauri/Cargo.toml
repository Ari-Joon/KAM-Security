[package]
name = "kam-shell"
description = "KAM Security desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which
# would otherwise collide on Windows.
name = "kam_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kam-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kam-canary = { workspace = true }
kam-core = { workspace = true }
kam-ipc = { workspace = true }
kam-firewall = { workspace = true }
kam-quarantine = { workspace = true }
kam-rules = { workspace = true }
kam-scanner = { workspace = true }
kam-schedule = { workspace = true }
kam-storage = { workspace = true }
kam-virustotal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
# Windows' own notification interfaces, used only here: the window is what
# tells the person a download has landed.
windows = { workspace = true, features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }
# Named only because the `implement` macro refers to it by name. That macro
# writes the one COM object this program provides, which watches a delete so
# that a file too large for the Recycle Bin is left alone (see `recycle.rs`).
# It is the `windows` crate's own core, at the version that crate brings in.
windows-core = "0.62"
# Taking zip archives apart, as the person, never in the agent. Reading needs
# only deflate; any other compression method is reported as one this cannot
# unpack rather than pulled in.
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[lints]
workspace = true
